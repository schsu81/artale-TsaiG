<head>
</head>
<body>
    
  <!-- 1. 縱向羊皮紙捲軸 (Vertical Scroll) -->
  <section class="scroll-v">
    <div class="scroll-v-cap top"></div>
    <div class="scroll-v-body">
      <h2 class="ms-title">📜 冒險者任務日誌</h2>
      <p class="ms-subtitle">完成每日挑戰以獲取皇家貴賓勳章與經驗值獎勵。</p>

      <!-- Div Grid 表格區塊 -->
      <div class="ms-grid-table">
        <!-- Table Header -->
        <div class="grid-header">任務名稱</div>
        <div class="grid-header">難度</div>
        <div class="grid-header">目標地區</div>
        <div class="grid-header">獎勵</div>

        <!-- Table Rows -->
        <div class="grid-cell">清除巴洛古</div>
        <div class="grid-cell"><span class="badge danger">Hard</span></div>
        <div class="grid-cell">奇幻村</div>
        <div class="grid-cell">EXP +50,000</div>

        <div class="grid-cell">蒐集綠水靈珠</div>
        <div class="grid-cell"><span class="badge easy">Easy</span></div>
        <div class="grid-cell">維多利亞島</div>
        <div class="grid-cell">楓幣 x 100,000</div>

        <div class="grid-cell">遠征隊龍王討伐</div>
        <div class="grid-cell"><span class="badge boss">Boss</span></div>
        <div class="grid-cell">神木村</div>
        <div class="grid-cell">龍王項鍊</div>

        <div class="grid-cell">尋找休菲凱曼</div>
        <div class="grid-cell"><span class="badge normal">Normal</span></div>
        <div class="grid-cell">怪物公園</div>
        <div class="grid-cell">公園入場券 x 3</div>
      </div>
    </div>
    <div class="scroll-v-cap bottom"></div>
  </section>

  <!-- 2. 橫向羊皮紙捲軸 (Horizontal Scroll) -->
  <section class="scroll-h-wrapper">
    <div class="scroll-h-cap left"></div>
    <div class="scroll-h-body">
      <h2 class="ms-title">⚔️ 職業與屬性面板</h2>
      <div class="ms-grid-cards">
        <div class="ms-card">
          <div class="card-title">力量 (STR)</div>
          <div class="card-val">1,450</div>
        </div>
        <div class="ms-card">
          <div class="card-title">敏捷 (DEX)</div>
          <div class="card-val">3,820</div>
        </div>
        <div class="ms-card">
          <div class="card-title">智力 (INT)</div>
          <div class="card-val">120</div>
        </div>
        <div class="ms-card">
          <div class="card-title">幸運 (LUK)</div>
          <div class="card-val">250</div>
        </div>
      </div>
    </div>
    <div class="scroll-h-cap right"></div>
  </section>
</body>
